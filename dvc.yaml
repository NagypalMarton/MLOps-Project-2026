stages:
  validate:
    cmd: python -m mlops_project.validate
    deps:
      - data/hotel_bookings.csv
      - src/mlops_project/config.py
      - src/mlops_project/data.py
      - src/mlops_project/schemas.py
      - src/mlops_project/validate.py
    outs:
      - reports/validation.json:
          cache: false
  prepare:
    cmd: python -m mlops_project.prepare
    deps:
      - data/hotel_bookings.csv
      - reports/validation.json
      - params.yaml
      - src/mlops_project/config.py
      - src/mlops_project/data.py
      - src/mlops_project/schemas.py
    outs:
      - data/prepared.csv
  train:
    cmd: python -m mlops_project.train
    deps:
      - data/prepared.csv
      - src/mlops_project/config.py
      - src/mlops_project/data.py
      - src/mlops_project/model.py
      - src/mlops_project/train.py
      - src/mlops_project/cli.py
      - params.yaml
    outs:
      - model/model.pkl
  evaluate:
    cmd: python -m mlops_project.evaluate
    deps:
      - model/model.pkl
      - data/prepared.csv
      - src/mlops_project/config.py
      - src/mlops_project/data.py
      - src/mlops_project/model.py
      - src/mlops_project/evaluate.py
    params:
      - slices
    metrics:
      - metrics/metrics.json:
          cache: false
      - metrics/slices.json:
          cache: false
  gate:
    cmd: python -m mlops_project.gate
    deps:
      - metrics/metrics.json
      - metrics/slices.json
      - metrics/baseline.json
      - src/mlops_project/gate.py
      - params.yaml
    outs:
      - reports/gate.json:
          cache: false