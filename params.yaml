# Hyperparameters for the model
model:
  max_iter: 1000
slices:
  - name: hotel
    column: hotel
    values:
      - City Hotel
      - Resort Hotel
  - name: deposit_type
    column: deposit_type
    values:
      - No Deposit
      - Non Refund
      - Refundable
fairness:
  slice: deposit_type
  metric: selection_rate
  min_support: 100
criteria_version: "hw2-r4-v1"
acceptance:
  absolute_floors:
    accuracy: 0.75
    f1: 0.70
  regression:
    primary_metric: f1
    tolerance: 0.01
    baseline_file: metrics/baseline.json
  slices:
    metric: f1
    floor: 0.70
    min_support: 100