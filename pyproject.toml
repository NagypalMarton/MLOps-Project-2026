[project]
name = "mlops-project"
version = "0.1.0"
description = "Semester MLOps project — your dataset, grown across HW1–HW5"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "scikit-learn>=1.8.0",
    "pandas>=2.0.0,<3",
    "python-dotenv>=1.0.0",
    "dvc[s3]>=3.0.0,<4",
    "mlflow>=2.0.0",
    "boto3>=1.0.0",
    "PyYAML>=6.0",
    "joblib>=1.0.0",
    "matplotlib>=3.0.0",
    "pandera[pandas]>=0.26.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
runs-for-data = "mlops_project.runs_for_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_project"]
